<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manager</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --fg:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#707579);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btnfg:var(--tg-theme-button-text-color,#fff);
  --card:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --line:rgba(127,127,127,.25);
  --danger:#d33;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:0 0 90px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:9px 6px;border:0;border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-weight:600}
.tabs button.on{background:var(--btn);color:var(--btnfg)}
main{padding:12px}
.status{margin:0 0 10px;color:var(--hint);font-size:13px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
label{display:block;margin:0 0 10px;font-size:13px;color:var(--hint)}
input,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
input:disabled,textarea:disabled{opacity:.55}
textarea{min-height:70px;resize:vertical}
button{font:inherit}
.primary{width:100%;padding:13px;border:0;border-radius:12px;background:var(--btn);color:var(--btnfg);font-weight:700}
.primary:disabled{opacity:.6}
.sm{width:auto;padding:10px 14px}
.ghost{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg)}
.ghost.danger{color:var(--danger)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.row input{margin:0}
.sw-row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}
.sw.on{border-color:var(--bg);outline:3px solid var(--btn)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font-weight:600;text-align:left}
.tpl.on{border-color:var(--btn)}
.tpl small{display:block;color:var(--hint);font-weight:400}
.logo-box{display:flex;gap:12px;align-items:center}
.logo-box .pic{width:84px;height:64px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--hint);font-size:12px;background:var(--bg)}
.logo-box img{max-width:100%;max-height:100%}
.item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border-radius:12px;margin-bottom:8px}
.item .meta{min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--hint);font-size:12.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;padding:1px 7px;border-radius:8px;background:var(--btn);color:var(--btnfg);font-size:11px;font-weight:700;margin-right:6px}
.badge.rec{background:#1b7a4b}
.lock{padding:18px;text-align:center}
.lock p{color:var(--hint)}
.empty{text-align:center;color:var(--hint);padding:30px 10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:12px;background:#222;color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
#toast.err{background:var(--danger)}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
</style>
</head>
<body>
<nav class="tabs" id="tabs">
  <button data-tab="profile">🏢 Profile</button>
  <button data-tab="customers">👥 Customers</button>
  <button data-tab="docs">📥 Downloads</button>
</nav>
<main id="view"><div class="empty">Loading…</div></main>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => Number(n).toLocaleString('en-NG', { maximumFractionDigits: 2 });
const fdate = (d) => new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'Africa/Lagos' });

let S = null;
let tab = new URLSearchParams(location.search).get('tab');
if (!['profile', 'customers', 'docs'].includes(tab)) tab = 'profile';
let editing = null; // customer being added/edited
let cq = '', dq = '';

async function api(path, method = 'GET', body) {
  const headers = { 'X-Init-Data': tg ? tg.initData : '' };
  if (body) headers['Content-Type'] = 'application/json';
  const r = await fetch('/api' + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = {};
  try { j = await r.json(); } catch (e) { /* not json */ }
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j;
}

let tt;
function toast(msg, err) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  clearTimeout(tt);
  tt = setTimeout(() => (el.className = ''), 2600);
}

function confirmBox(msg, cb) {
  if (tg && tg.showConfirm) tg.showConfirm(msg, (ok) => ok && cb());
  else if (confirm(msg)) cb();
}

const lockedCard = (what) => `
  <div class="card lock">
    <h3>🔒 ${esc(what)} is a Pro feature</h3>
    <p>Upgrade from the bot menu (⭐ Upgrade) to unlock it.</p>
    <button class="primary sm" data-act="close">Back to bot</button>
  </div>`;

/* ───────────── Profile ───────────── */
function profileView() {
  const u = S.user, pro = S.pro, dis = pro ? '' : 'disabled';
  const sw = Object.entries(S.colors).map(([n, h]) =>
    `<button class="sw ${u.accent === h ? 'on' : ''}" data-act="color" data-v="${h}" style="background:#${h}" title="${esc(n)}" ${dis}></button>`).join('');
  const tp = S.templates.map((t) => {
    const locked = !pro && !t.free;
    return `<button class="tpl ${u.template === t.key ? 'on' : ''}" data-act="tpl" data-v="${t.key}" ${locked ? 'disabled' : ''}>${locked ? '🔒 ' : ''}${esc(t.name)}<small>${t.free ? 'Free' : 'Pro'}</small></button>`;
  }).join('');
  return `
    <p class="status">${esc(S.status)}</p>
    <div class="card">
      <h3>Business details</h3>
      <label>Business name<input id="f_biz" maxlength="60" value="${esc(u.biz_name)}" placeholder="e.g. Ada Stores"></label>
      <label>Phone<input id="f_phone" maxlength="30" inputmode="tel" value="${esc(u.phone)}" placeholder="0801 234 5678"></label>
      <label>Address<textarea id="f_addr" maxlength="120" placeholder="Shop address">${esc(u.address)}</textarea></label>
    </div>
    <div class="card">
      <h3>${pro ? '' : '🔒 '}Payment details (invoices)</h3>
      <label>Bank details<textarea id="f_bank" maxlength="200" ${dis} placeholder="GTBank · 0123456789 · Ada Stores">${esc(u.bank)}</textarea></label>
    </div>
    <div class="card">
      <h3>${pro ? '' : '🔒 '}Logo</h3>
      <div class="logo-box">
        <div class="pic" id="logoPic">${u.has_logo ? '…' : 'No logo'}</div>
        <div class="acts" style="justify-content:flex-start">
          <button class="ghost" data-act="logo" ${dis}>Upload</button>
          <button class="ghost danger" data-act="logo-del" ${pro && u.has_logo ? '' : 'disabled'}>Remove</button>
        </div>
      </div>
      <input id="logoFile" type="file" accept="image/png,image/jpeg" hidden>
    </div>
    <div class="card">
      <h3>${pro ? '' : '🔒 '}Brand colour</h3>
      <div class="sw-row">${sw}</div>
    </div>
    <div class="card">
      <h3>Default template</h3>
      <div class="tpls">${tp}</div>
    </div>
    <div class="savebar"><button class="primary" data-act="save">Save changes</button></div>`;
}

function readProfileInputs() {
  if (!$('#f_biz')) return;
  S.user.biz_name = $('#f_biz').value;
  S.user.phone = $('#f_phone').value;
  S.user.address = $('#f_addr').value;
  if (S.pro) S.user.bank = $('#f_bank').value;
}

async function loadLogo() {
  const pic = $('#logoPic');
  if (!pic || !S.user.has_logo || !S.pro) return;
  try {
    const r = await fetch('/api/logo', { headers: { 'X-Init-Data': tg ? tg.initData : '' }, cache: 'no-store' });
    if (!r.ok) throw new Error();
    const url = URL.createObjectURL(await r.blob());
    pic.innerHTML = `<img src="${url}" alt="logo">`;
  } catch (e) { pic.textContent = 'Logo saved'; }
}

function resizeToDataUrl(file, max = 400) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      const ctx = c.getContext('2d');
      const jpeg = file.type === 'image/jpeg';
      if (jpeg) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(jpeg ? c.toDataURL('image/jpeg', 0.9) : c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image could not be read.')); };
    img.src = url;
  });
}

async function saveProfile(btn) {
  readProfileInputs();
  btn.disabled = true;
  try {
    await api('/profile', 'POST', S.user);
    toast('Saved ✅');
  } catch (e) { toast(e.message, true); }
  btn.disabled = false;
}

/* ───────────── Customers ───────────── */
function customerListHtml() {
  const q = cq.trim().toLowerCase();
  const list = S.customers.filter((c) => !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q));
  if (!list.length) return `<div class="empty">${S.customers.length ? 'No match.' : 'No customers yet. Tap “＋ Add” to create one.'}</div>`;
  return list.map((c) => `
    <div class="item">
      <div class="meta"><b>${esc(c.name)}</b><span class="hint">${esc(c.phone || 'No phone')} · ${c.docs} doc${c.docs === 1 ? '' : 's'}</span></div>
      <div class="acts">
        <button class="ghost" data-act="cinv" data-id="${c.id}">🧾</button>
        <button class="ghost" data-act="crec" data-id="${c.id}">💵</button>
        <button class="ghost" data-act="cedit" data-id="${c.id}">✏️</button>
        <button class="ghost danger" data-act="cdel" data-id="${c.id}">🗑</button>
      </div>
    </div>`).join('');
}

function customerFormHtml() {
  if (!editing) return '';
  return `
    <div class="card">
      <h3>${editing.id ? 'Edit customer' : 'New customer'}</h3>
      <label>Name<input id="c_name" maxlength="80" value="${esc(editing.name)}"></label>
      <label>Phone (optional)<input id="c_phone" maxlength="30" inputmode="tel" value="${esc(editing.phone)}"></label>
      <div class="row" style="margin:0">
        <button class="primary" data-act="csave">Save</button>
        <button class="ghost" data-act="ccancel">Cancel</button>
      </div>
    </div>`;
}

function customersView() {
  if (!S.pro) return lockedCard('Saved customers');
  return `
    <div class="row">
      <input id="cq" type="search" placeholder="Search customers" value="${esc(cq)}">
      <button class="primary sm" data-act="cadd">＋ Add</button>
    </div>
    <div id="cform">${customerFormHtml()}</div>
    <div id="clist">${customerListHtml()}</div>
    <p class="hint">🧾 new invoice · 💵 new receipt · ✏️ edit · 🗑 remove</p>`;
}

/* ───────────── Downloads ───────────── */
function docListHtml() {
  const q = dq.trim().toLowerCase();
  const list = S.docs.filter((d) => !q || d.number.toLowerCase().includes(q) || (d.customer || '').toLowerCase().includes(q));
  if (!list.length) return `<div class="empty">${S.docs.length ? 'No match.' : 'No documents yet. Create your first invoice or receipt from the bot.'}</div>`;
  return list.map((d) => `
    <div class="item">
      <div class="meta">
        <b><span class="badge ${d.kind === 'receipt' ? 'rec' : ''}">${d.kind === 'receipt' ? 'REC' : 'INV'}</span>${esc(d.number)} · ${esc(d.customer || '')}</b>
        <span class="hint">${fdate(d.created_at)} · ₦${money(d.total)}</span>
      </div>
      <button class="ghost" data-act="dsend" data-id="${d.id}">📥 PDF</button>
    </div>`).join('');
}

function docsView() {
  return `
    <p class="status">Tap <b>📥 PDF</b> and the file is sent to your Telegram chat with the bot.${S.pro ? '' : ' Free plan shows your last 3 documents.'}</p>
    <div class="row"><input id="dq" type="search" placeholder="Search by number or customer" value="${esc(dq)}"></div>
    <div id="dlist">${docListHtml()}</div>`;
}

/* ───────────── Shell ───────────── */
function render() {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = ({ profile: profileView, customers: customersView, docs: docsView })[tab]();
  window.scrollTo(0, 0);
  if (tab === 'profile') loadLogo();
}

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (!b || !S) return;
  if (tab === 'profile') readProfileInputs();
  tab = b.dataset.tab;
  editing = null;
  render();
});

$('#view').addEventListener('input', (e) => {
  if (e.target.id === 'cq') { cq = e.target.value; $('#clist').innerHTML = customerListHtml(); }
  if (e.target.id === 'dq') { dq = e.target.value; $('#dlist').innerHTML = docListHtml(); }
});

$('#view').addEventListener('change', async (e) => {
  if (e.target.id !== 'logoFile' || !e.target.files[0]) return;
  try {
    const image = await resizeToDataUrl(e.target.files[0]);
    await api('/logo', 'POST', { image });
    S.user.has_logo = true;
    toast('Logo saved ✅');
    readProfileInputs();
    render();
  } catch (err) { toast(err.message, true); }
});

$('#view').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, id = Number(el.dataset.id);
  try {
    switch (act) {
      case 'close': if (tg) tg.close(); break;
      case 'save': await saveProfile(el); break;
      case 'color':
        S.user.accent = el.dataset.v;
        document.querySelectorAll('.sw').forEach((b) => b.classList.toggle('on', b === el));
        break;
      case 'tpl':
        S.user.template = el.dataset.v;
        document.querySelectorAll('.tpl').forEach((b) => b.classList.toggle('on', b === el));
        break;
      case 'logo': $('#logoFile').click(); break;
      case 'logo-del':
        confirmBox('Remove your logo?', async () => {
          try {
            await api('/logo', 'DELETE');
            S.user.has_logo = false;
            readProfileInputs();
            render();
            toast('Logo removed');
          } catch (err) { toast(err.message, true); }
        });
        break;

      case 'cadd': editing = { name: '', phone: '' }; $('#cform').innerHTML = customerFormHtml(); $('#c_name').focus(); break;
      case 'cedit': {
        const c = S.customers.find((x) => x.id === id);
        if (!c) break;
        editing = { id: c.id, name: c.name, phone: c.phone || '' };
        $('#cform').innerHTML = customerFormHtml();
        window.scrollTo(0, 0);
        break;
      }
      case 'ccancel': editing = null; $('#cform').innerHTML = ''; break;
      case 'csave': {
        el.disabled = true;
        try {
          const r = await api('/customers', 'POST', { id: editing.id, name: $('#c_name').value, phone: $('#c_phone').value });
          S.customers = r.customers;
          editing = null;
          $('#cform').innerHTML = '';
          $('#clist').innerHTML = customerListHtml();
          toast('Customer saved ✅');
        } finally { el.disabled = false; }
        break;
      }
      case 'cdel': {
        const c = S.customers.find((x) => x.id === id);
        if (!c) break;
        confirmBox(`Remove ${c.name}? Their documents stay in your history.`, async () => {
          try {
            const r = await api('/customers/' + id, 'DELETE');
            S.customers = r.customers;
            $('#clist').innerHTML = customerListHtml();
            toast('Removed');
          } catch (err) { toast(err.message, true); }
        });
        break;
      }
      case 'cinv': location.href = `/form?mode=invoice&c=${id}`; break;
      case 'crec': location.href = `/form?mode=receipt&c=${id}`; break;

      case 'dsend':
        el.disabled = true;
        el.textContent = 'Sending…';
        try {
          await api(`/docs/${id}/send`, 'POST');
          toast('Sent to your chat ✅');
        } finally { el.disabled = false; el.textContent = '📥 PDF'; }
        break;
    }
  } catch (err) { toast(err.message, true); }
});

(async () => {
  try {
    S = await api('/manage/init');
    render();
  } catch (e) {
    $('#view').innerHTML = `<div class="empty">${esc(e.message)}<br><br>Open this page from the bot's menu.</div>`;
  }
})();
</script>
</body>
</html>
